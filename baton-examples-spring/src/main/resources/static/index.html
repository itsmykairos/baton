<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baton example</title>
  <style>
    :root { color-scheme: light dark; --fg: #202124; --muted: #5f6368; --line: #dadce0; --bg: #ffffff; --card: #f8f9fa; --accent: #1a73e8; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --bg: #202124; --card: #292a2d; --accent: #8ab4f8; } }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    h2 { font-size: 17px; font-weight: 600; margin: 32px 0 8px; }
    p.lead, .muted { color: var(--muted); margin: 0; }
    nav a, a { color: var(--accent); }
    nav { margin: 12px 0 0; display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow-x: auto; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    select, input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .status { font-weight: 600; }
    .error { color: #d93025; }
  </style>
</head>
<body>
<main>
  <h1>Baton example</h1>
  <p class="lead">A checkout pipeline declared in <code>application.yml</code>, run per request.</p>
  <nav>
    <a href="/actuator/baton">/actuator/baton</a>
    <a href="/actuator/baton/checkout">/actuator/baton/checkout</a>
    <a href="/actuator/health">/actuator/health</a>
  </nav>

  <h2>Pipeline design</h2>
  <div class="row">
    <label for="pipeline">Pipeline</label>
    <select id="pipeline"></select>
    <span class="muted" id="pipeline-info"></span>
  </div>
  <div class="card" id="design">Loading…</div>

  <h2>Run a checkout</h2>
  <div class="row">
    <label for="order">Order id</label>
    <input id="order" value="A-1001" size="10">
    <button id="run">Run checkout</button>
    <span id="outcome"></span>
  </div>
  <div class="card" id="run-diagram"><span class="muted">Run a checkout to see its stages here.</span></div>
  <div class="card" id="run-stages" style="margin-top: 12px; display: none"></div>
</main>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

  let counter = 0;
  async function draw(target, source) {
    try {
      const { svg } = await mermaid.render("diagram" + (++counter), source);
      target.innerHTML = svg;
    } catch (error) {
      target.innerHTML = `<p class="error">Could not render diagram: ${error.message ?? error}</p>`;
    }
  }

  const select = document.getElementById("pipeline");
  async function showPipeline(bean) {
    const response = await fetch(`/actuator/baton/${encodeURIComponent(bean)}`);
    const report = await response.json();
    const s = report.settings;
    document.getElementById("pipeline-info").textContent =
      `${report.layers.length} layers · flatten depth ${s.contextFlattenDepth} · conflicts ${s.layerConflictPolicy}`
      + (s.runTimeout ? ` · run timeout ${s.runTimeout}` : "");
    await draw(document.getElementById("design"), report.mermaid);
  }

  const list = await (await fetch("/actuator/baton")).json();
  for (const [bean, summary] of Object.entries(list.pipelines)) {
    const option = document.createElement("option");
    option.value = bean;
    option.textContent = `${bean} (${summary.stages} stages)`;
    option.selected = bean === "checkout";
    select.append(option);
  }
  select.addEventListener("change", () => showPipeline(select.value));
  await showPipeline(select.value);

  const button = document.getElementById("run");
  button.addEventListener("click", async () => {
    button.disabled = true;
    const outcome = document.getElementById("outcome");
    outcome.textContent = "Running…";
    try {
      const order = document.getElementById("order").value || "A-1001";
      const result = await (await fetch(`/checkout?orderId=${encodeURIComponent(order)}`, { method: "POST" })).json();
      outcome.innerHTML = `<span class="status">${result.status}</span>`
        + ` · receipt ${result.receipt ?? "none"} · recommendation ${result.recommendation ?? "none"}`;
      await draw(document.getElementById("run-diagram"), result.mermaid);
      const rows = result.stages.map(stage => `<tr><td>${stage.path}</td><td>${stage.status}</td>`
        + `<td>${stage.durationMs} ms</td><td>${stage.attempts}</td><td>${stage.failure ?? ""}</td></tr>`).join("");
      const table = document.getElementById("run-stages");
      table.innerHTML = `<table><thead><tr><th>Stage</th><th>Status</th><th>Duration</th><th>Attempts</th>`
        + `<th>Failure</th></tr></thead><tbody>${rows}</tbody></table>`;
      table.style.display = "block";
    } catch (error) {
      outcome.innerHTML = `<span class="error">${error.message ?? error}</span>`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
